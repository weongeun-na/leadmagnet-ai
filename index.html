<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="주제와 7가지 질문으로 나에게 맞는 리드마그넷 유형과 제목·구성안·랜딩 카피를 추천받는 무료 진단 도구">
<title>리드마그넷 추천기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 한 장짜리 도구. 질문 카드 → 추천 결과 → 이메일 게이트 → 전체 리포트 순으로 같은 폭에서 아래로 이어진다. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --ink:#14182B; --muted:#5B6277; --line:#E1E4EE;
  --accent:#2A56B8; --accent-ink:#FFFFFF; --accent-soft:#E6ECFA; --warn:#B4540A; --warn-soft:#FDF0E1;
  --c-ebook:#7C4DDB; --c-quiz:#D9820B; --c-check:#169A6F; --c-guide:#2F6FE0; --c-tmpl:#5B5BD6; --c-case:#D1397A;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1120; --surface:#171B2E; --ink:#ECEEF7; --muted:#9BA2BA; --line:#2A2F49;
  --accent:#86A8F5; --accent-ink:#0E1120; --accent-soft:#222A47; --warn:#F0A460; --warn-soft:#33261A;
  --c-ebook:#A98BF0; --c-quiz:#F0A93F; --c-check:#3CC796; --c-guide:#6B9BF5; --c-tmpl:#8D8DF0; --c-case:#EE6FA3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#171B2E; --ink:#ECEEF7; --muted:#9BA2BA; --line:#2A2F49;
  --accent:#86A8F5; --accent-ink:#0E1120; --accent-soft:#222A47; --warn:#F0A460; --warn-soft:#33261A;
  --c-ebook:#A98BF0; --c-quiz:#F0A93F; --c-check:#3CC796; --c-guide:#6B9BF5; --c-tmpl:#8D8DF0; --c-case:#EE6FA3; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.65;font-size:15px;padding-inline:16px;padding-block:28px 64px;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:860px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(26px,5vw,36px);line-height:1.25;margin:4px 0 8px;font-weight:900;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:20px;margin:0;font-weight:700;text-wrap:balance}
h3{font-size:16px;margin:0;font-weight:700}
p{margin:0}
.lead{color:var(--muted);max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.sample-note{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.sample-note b{font-family:var(--font-mono);font-weight:500;font-size:11px;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
form{display:flex;flex-direction:column;gap:22px}
.q{display:flex;flex-direction:column;gap:9px;border:0;padding:0;margin:0;min-width:0}
.q legend{font-weight:700;padding:0;margin-bottom:2px}
.q .hint{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.chip span{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:14px;background:var(--bg);transition:background .15s,border-color .15s}
.chip input:checked + span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=email]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input[type=text]:focus-visible,input[type=email]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:13px 22px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--warn);font-size:13px;min-height:18px}
#analyzing{text-align:center;padding:40px 16px;color:var(--muted)}
.dots{display:inline-flex;gap:6px;margin-bottom:10px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:b 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
.pick{display:flex;flex-direction:column;gap:14px}
.pick .tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.pick .dot{width:10px;height:10px;border-radius:3px;background:var(--tc)}
.pick .name{font-size:clamp(28px,6vw,40px);font-weight:900;line-height:1.2;letter-spacing:-.01em}
.fit{display:flex;align-items:baseline;gap:8px}
.fit b{font-family:var(--font-mono);font-size:30px;font-weight:500;color:var(--tc);font-variant-numeric:tabular-nums}
.fit span{color:var(--muted);font-size:13px}
.reasons{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.reasons li{padding-left:18px;position:relative}
.reasons li::before{content:"";position:absolute;left:2px;top:.7em;width:7px;height:7px;border-radius:2px;background:var(--tc)}
.reasons small{display:block;color:var(--muted);font-size:13px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:12px 14px;font-size:14px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(78px,110px) 1fr 44px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--tc);border-radius:6px}
.bar .v{font-family:var(--font-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar.top .nm{font-weight:700}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kv{background:var(--bg);border-radius:10px;padding:12px 14px;min-width:0}
.kv small{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv div{font-weight:700;margin-top:2px}
.preview-title{font-weight:700;margin-bottom:6px}
.gate-wrap{position:relative}
.locked{display:flex;flex-direction:column;gap:14px;opacity:.55;pointer-events:none;user-select:none}
.sk{display:flex;flex-direction:column;gap:7px}
.sk i{display:block;height:9px;border-radius:5px;background:var(--line)}
.sk i:nth-child(2){width:86%}.sk i:nth-child(3){width:64%}
.gate{margin-top:-60px;position:relative;z-index:1;border:1px solid var(--accent);box-shadow:0 10px 30px rgba(20,24,43,.12)}
.gate form{gap:12px}
.consent{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}
.consent input{margin-top:4px}
.fine{font-size:12px;color:var(--muted)}
.report{display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:10px;padding-top:18px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:0}
.sec h3 .idx{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-right:8px;font-weight:500}
.sec ul,.sec ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.copyline{background:var(--bg);border-radius:10px;padding:12px 14px}
.copyline b{display:block;font-size:12px;font-family:var(--font-mono);font-weight:500;color:var(--muted);letter-spacing:.05em}
.mail{background:var(--bg);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.mail .when{font-family:var(--font-mono);font-size:12px;color:var(--accent)}
.alt{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.alt .kv{border-left:3px solid var(--tc)}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.cta{background:var(--accent-soft);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.cta b{font-size:16px}
[hidden]{display:none!important}
@media (max-width:520px){.bar{grid-template-columns:78px 1fr 40px}.card{padding:16px}}
html{-webkit-text-size-adjust:100%}body{margin:0}
</style>
</head>

<div class="wrap">
  <header>

    <h1>우리 비즈니스에 맞는 리드마그넷, 1분이면 정해집니다</h1>

  <section class="card" id="formCard" aria-labelledby="fh">

</div>

function maxFor(k){
 var m=0;
 Q.forEach(function(q){
  if(q.type==='multi'){q.opts.forEach(function(o){if(o.w[k]>0)m+=o.w[k]})}
  else{var b=0;q.opts.forEach(function(o){if((o.w[k]||0)>b)b=o.w[k]});m+=b}
 });
 return m;
}

  var els=form.querySelectorAll('input[name="'+q.key+'"]:checked');
  a[q.key]=q.type==='multi'?Array.prototype.map.call(els,function(e){return e.value}):(els[0]?els[0].value:null);
 });
 return a;
}
function score(a){
 var S={},contrib={};
 TYPES.forEach(function(t){S[t.k]=0;contrib[t.k]={}});
 Q.forEach(function(q){
  var picked=q.type==='multi'?a[q.key]:[a[q.key]];
  picked.forEach(function(v){
   var o=q.opts.filter(function(x){return x.v===v})[0];if(!o)return;
   TYPES.forEach(function(t){var w=o.w[t.k]||0;S[t.k]+=w;contrib[t.k][q.key]=(contrib[t.k][q.key]||0)+w});
  });
 });
 if(a.assets.indexOf('reviews')<0){S.case-=3;contrib.case.assets=(contrib.case.assets||0)-3}
 return {S:S,contrib:contrib};
}
function rank(a){
 var r=score(a);
 var list=TYPES.map(function(t,i){
  var fit=Math.max(0,Math.min(96,Math.round(100*r.S[t.k]/maxFor(t.k))));
  return {t:t,s:r.S[t.k],fit:fit,i:i};
 });
 list.sort(function(x,y){return y.fit-x.fit||y.s-x.s||x.i-y.i});
 return {list:list,contrib:r.contrib};
}
